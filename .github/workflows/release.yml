name: Release

# Builds release binaries for every supported platform/architecture and
# drafts a semver-tagged release on every push to master (the tag is
# v<version> from Cargo.toml). Re-running with the same version refreshes the
# draft (delete + recreate).
#
# Targets:
#   linux-gnu (glibc 2.17, .2.17 suffix → runs on old distros incl.
#              Raspberry Pi 0/1 on Raspbian): x86_64, i686, aarch64,
#              armv7 (gnueabihf), arm/armv6 (gnueabihf), riscv64gc
#   linux-musl (fully static): x86_64, aarch64
#   windows-gnu: x86_64, i686   (no aarch64-pc-windows-gnu — removed from rustc)
#   darwin: x86_64 (Intel), aarch64 (Apple Silicon)
#
# Note: riscv64gc-unknown-linux-gnu and i686-pc-windows-gnu are not in
# cargo-zigbuild's own CI matrix, so they are smoke-built on every release.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu.2.17
          - i686-unknown-linux-gnu.2.17
          - aarch64-unknown-linux-gnu.2.17
          - armv7-unknown-linux-gnueabihf.2.17
          - arm-unknown-linux-gnueabihf.2.17
          # riscv64 did not exist before glibc 2.27, so .2.17 is not a
          # valid target for it (zig rejects the triple outright).
          - riscv64gc-unknown-linux-gnu.2.27
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - i686-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rustup does not know the .2.17 glibc suffix: add the bare target.
      - name: Add target
        run: rustup target add "${TARGET%%.*}"
        env:
          TARGET: ${{ matrix.target }}
      # v2 or newer is required: v1 requests the pre-0.14.1 tarball name
      # (zig-linux-x86_64-<ver>) which no longer exists, so every mirror
      # 404s. v2.0.1 added the current zig-<arch>-<os>-<ver> naming, and
      # v2.2.0 added a hardcoded mirror fallback for when the community
      # mirrors are down.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build (zigbuild)
        run: cargo zigbuild --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          # Asset name without the glibc suffix. rustc knows only the bare
          # triple, so that is also where cargo puts the artifacts.
          name="${target%%.*}"
          # Drop the `unknown-` segment of the triple for the release asset
          # name (x86_64-unknown-linux-gnu → x86_64-linux-gnu).
          asset="${name//unknown-/}"
          # Windows targets are built as opencc.exe. The binaries were
          # previously copied as `opencc` and renamed afterwards, which meant
          # the copy itself could never find them.
          ext=""
          case "$name" in *-pc-windows-*) ext=".exe" ;; esac
          bin_dir="target/${target}/release"
          [ -f "${bin_dir}/opencc${ext}" ] || bin_dir="target/${name}/release"
          # One self-contained package per platform: both binaries + README
          # + the platform's installer — install.ps1 on Windows, install.sh
          # everywhere else. Windows ships as .zip, everything else as
          # .tar.gz, so the right script is the only one in the archive.
          pkg="pkg/opencc-${asset}"
          mkdir -p "$pkg" dist
          cp "${bin_dir}/opencc${ext}"       "$pkg/opencc${ext}"
          cp "${bin_dir}/opencc-proxy${ext}" "$pkg/opencc-proxy${ext}"
          cp README.md "$pkg/"
          if [[ -n "$ext" ]]; then
            cp install.ps1 "$pkg/"
            if command -v zip >/dev/null 2>&1; then
              ( cd pkg && zip -qr "../dist/opencc-${asset}.zip" "opencc-${asset}" )
            else
              ( cd pkg && python3 -c 'import shutil,sys; shutil.make_archive(sys.argv[1], "zip", ".", sys.argv[2])' "../dist/opencc-${asset}" "opencc-${asset}" )
            fi
          else
            cp install.sh "$pkg/"
            chmod +x "$pkg/install.sh"
            tar -C pkg -czf "dist/opencc-${asset}.tar.gz" "opencc-${asset}"
          fi
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          # Release asset name (no-op for apple triples, which have no
          # `unknown-` segment, but keeps the naming rule in one place).
          asset="${target//unknown-/}"
          # Same self-contained package as the Linux builds: binaries +
          # README + install.sh, as a .tar.gz archive.
          pkg="pkg/opencc-${asset}"
          mkdir -p "$pkg" dist
          cp "target/${target}/release/opencc"       "$pkg/opencc"
          cp "target/${target}/release/opencc-proxy" "$pkg/opencc-proxy"
          cp README.md install.sh "$pkg/"
          chmod +x "$pkg/install.sh"
          tar -C pkg -czf "dist/opencc-${asset}.tar.gz" "opencc-${asset}"
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    # The env context is not available in job-level expressions, so the
    # version can't appear here — it's computed in a step below and shown in
    # the release title instead.
    name: draft release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compute version (Cargo.toml semver)
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          ls -la
      # Drafts are always deletable; this refreshes the draft when the same
      # version is pushed again.
      - name: Delete previous draft (same version)
        run: gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create draft release + upload assets
        run: |
          gh release create "v${{ env.VERSION }}" --draft --target "${{ github.sha }}" \
            --title "opencc v${{ env.VERSION }}" \
            --notes "Rust rewrite of opencc + opencc-proxy. See the [README](https://github.com/${{ github.repository }}/blob/master/README.md) for installation and the [plan](https://github.com/${{ github.repository }}/blob/master/PLAN.md) for the architecture."
          gh release upload "v${{ env.VERSION }}" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
