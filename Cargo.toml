[package]
name = "opencc"
version = "0.1.0"
edition = "2021"
description = "Run Claude Code against alternative backends (OpenAI, OpenCode) through a local proxy"
license = "MIT"

[lib]
name = "opencc"
path = "src/lib.rs"

[[bin]]
name = "opencc"
path = "src/main.rs"

[[bin]]
name = "opencc-proxy"
path = "src/bin/opencc-proxy.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
